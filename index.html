<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        #startScreen h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        #startScreen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        #startScreen input:focus {
            outline: none;
            border-color: #667eea;
        }

        #startButton {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        #startButton:hover {
            background: #5568d3;
        }

        /* Game Screen */
        #gameScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #gameScore {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        canvas {
            border: 2px solid #333;
            background: #000;
            display: block;
        }

        /* Game Over Screen */
        #gameOverScreen h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        #finalStats {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        #playAgainButton {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #playAgainButton:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>🐍 Aether Snake</h1>
            <input type="text" id="nicknameInput" placeholder="Enter your nickname">
            <button id="startButton">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div id="gameScore">Score: 0</div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <h2>Game Over!</h2>
            <div id="finalStats"></div>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
