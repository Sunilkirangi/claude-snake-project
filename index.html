<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        #startScreen h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .profile-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .profile-avatar-img,
        .profile-avatar-fallback {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .profile-avatar-img {
            object-fit: cover;
            display: block;
        }

        .profile-avatar-fallback {
            display: none;
            background: #667eea;
            color: white;
            font-size: 1.6em;
            font-weight: bold;
            align-items: center;
            justify-content: center;
        }

        .profile-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        #startScreen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 30px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        #startScreen input:focus {
            outline: none;
            border-color: #667eea;
        }

        .avatar-selector {
            margin-bottom: 30px;
        }

        .avatar-selector label {
            display: block;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .avatar-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .avatar-btn {
            width: 60px;
            height: 60px;
            border: 3px solid #ddd;
            border-radius: 50%;
            background: white;
            font-size: 2em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-btn:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .avatar-btn.selected {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        #startButton {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        #startButton:hover {
            background: #5568d3;
        }

        #startButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Game Screen */
        #gameScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #gameScore {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }

        #gameLevel {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 20px;
        }

        canvas {
            border: 2px solid #333;
            background: #000;
            display: block;
        }

        /* Game Over Screen */
        #gameOverScreen {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        #gameOverScreen h2 {
            color: #d32f2f;
            margin-bottom: 40px;
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #finalStats {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #finalStats p {
            font-size: 1.3em;
            color: #333;
            margin: 12px 0;
            line-height: 1.8;
        }

        #finalStats p strong {
            color: #667eea;
            font-weight: bold;
        }

        .player-info {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .snake-length {
            font-size: 1.5em;
            color: #666;
        }

        #playAgainButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 50px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #playAgainButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #playAgainButton:active {
            transform: translateY(0);
        }
    </style>
    <script>
        // Level registry (defined before loading levels)
        const LEVELS = {};

        function storeLevel(level) {
            LEVELS[level.id] = level;
        }
    </script>
    <script src="levels/level-1.js"></script>
    <script src="levels/level-2.js"></script>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>🐍 Aether Snake</h1>
            <div class="profile-badge">
                <img id="profileAvatarImg" class="profile-avatar-img" src="assets/me.png" alt="Sunil">
                <div id="profileAvatarFallback" class="profile-avatar-fallback" aria-hidden="true">S</div>
                <span class="profile-name">Sunil</span>
            </div>
            <input type="text" id="nicknameInput" placeholder="Enter your nickname" maxlength="20">
            <div class="avatar-selector">
                <label>Choose your avatar:</label>
                <div class="avatar-options">
                    <button class="avatar-btn" data-avatar="🔴">🔴</button>
                    <button class="avatar-btn" data-avatar="🟠">🟠</button>
                    <button class="avatar-btn" data-avatar="🟡">🟡</button>
                    <button class="avatar-btn" data-avatar="🟢">🟢</button>
                    <button class="avatar-btn" data-avatar="🔵">🔵</button>
                </div>
            </div>
            <button id="startButton" disabled>Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div id="gameLevel">Level 1</div>
            <div id="gameScore">Food: 0 / 10</div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <h2>Game Over!</h2>
            <div id="finalStats"></div>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            nickname: '',
            avatar: null,
            snake: [],
            food: {},
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            gameActive: false,
            currentLevel: 1,
            foodEaten: 0
        };

        // Screen management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Profile badge: static display of the current player's picture/name.
        const profileAvatarImg = document.getElementById('profileAvatarImg');
        const profileAvatarFallback = document.getElementById('profileAvatarFallback');

        profileAvatarImg.addEventListener('error', () => {
            profileAvatarImg.style.display = 'none';
            profileAvatarFallback.style.display = 'flex';
        });

        // Start Screen Logic
        const nicknameInput = document.getElementById('nicknameInput');
        const startButton = document.getElementById('startButton');
        const avatarButtons = document.querySelectorAll('.avatar-btn');

        function updateStartButtonState() {
            const hasNickname = nicknameInput.value.trim().length > 0;
            const hasAvatar = gameState.avatar !== null;
            startButton.disabled = !(hasNickname && hasAvatar);
        }

        nicknameInput.addEventListener('input', () => {
            gameState.nickname = nicknameInput.value.trim();
            updateStartButtonState();
        });

        avatarButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                avatarButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                gameState.avatar = btn.dataset.avatar;
                updateStartButtonState();
            });
        });

        startButton.addEventListener('click', () => {
            if (gameState.nickname && gameState.avatar) {
                gameState.currentLevel = 1;
                gameState.foodEaten = 0;
                initGame();
                showScreen('gameScreen');
            }
        });

        // Game initialization
        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            const level = LEVELS[gameState.currentLevel];

            gameState.snake = [];
            for (let i = 0; i < level.startSnakeLength; i++) {
                gameState.snake.push({ x: Math.floor(tileCount / 2) - i, y: Math.floor(tileCount / 2) });
            }
            gameState.direction = { x: 1, y: 0 };
            gameState.nextDirection = { x: 1, y: 0 };
            gameState.gameActive = true;
            gameState.foodEaten = 0;

            updateLevelDisplay();
            spawnFood();
            gameLoop(ctx, gridSize, tileCount);
        }

        function spawnFood() {
            const canvas = document.getElementById('gameCanvas');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            const level = LEVELS[gameState.currentLevel];
            let valid = false;

            while (!valid) {
                gameState.food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                valid = !level.obstacles.some(obs => obs[0] === gameState.food.x && obs[1] === gameState.food.y);
            }
        }


        function gameLoop(ctx, gridSize, tileCount) {
            if (!gameState.gameActive) return;

            update();
            render(ctx, gridSize);

            const level = LEVELS[gameState.currentLevel];
            setTimeout(() => gameLoop(ctx, gridSize, tileCount), level.speed);
        }

        function update() {
            gameState.direction = gameState.nextDirection;
            const head = gameState.snake[0];
            const newHead = {
                x: head.x + gameState.direction.x,
                y: head.y + gameState.direction.y
            };

            const canvas = document.getElementById('gameCanvas');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            const level = LEVELS[gameState.currentLevel];

            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                endGame();
                return;
            }

            if (level.obstacles.some(obs => obs[0] === newHead.x && obs[1] === newHead.y)) {
                endGame();
                return;
            }

            for (let segment of gameState.snake) {
                if (newHead.x === segment.x && newHead.y === segment.y) {
                    endGame();
                    return;
                }
            }

            gameState.snake.unshift(newHead);

            if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
                gameState.foodEaten++;
                updateLevelDisplay();
                const level = LEVELS[gameState.currentLevel];
                if (gameState.foodEaten >= level.foodToFinish) {
                    advanceLevel();
                } else {
                    spawnFood();
                }
            } else {
                gameState.snake.pop();
            }
        }

        function render(ctx, gridSize) {
            const canvas = document.getElementById('gameCanvas');
            const level = LEVELS[gameState.currentLevel];

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#444';
            for (let obs of level.obstacles) {
                ctx.fillRect(obs[0] * gridSize, obs[1] * gridSize, gridSize - 1, gridSize - 1);
            }

            ctx.fillStyle = '#fff';
            for (let segment of gameState.snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            }

            ctx.fillStyle = '#f00';
            ctx.fillRect(gameState.food.x * gridSize, gameState.food.y * gridSize, gridSize - 1, gridSize - 1);
        }

        function updateLevelDisplay() {
            const level = LEVELS[gameState.currentLevel];
            document.getElementById('gameLevel').textContent = `${level.name}`;
            document.getElementById('gameScore').textContent = `Food: ${gameState.foodEaten} / ${level.foodToFinish}`;
        }

        function advanceLevel() {
            gameState.currentLevel++;
            if (gameState.currentLevel > 2) {
                endGame();
            } else {
                gameState.gameActive = false;
                setTimeout(() => {
                    const canvas = document.getElementById('gameCanvas');
                    const ctx = canvas.getContext('2d');
                    const gridSize = 20;
                    const tileCount = canvas.width / gridSize;
                    initGame();
                }, 500);
            }
        }

        function endGame() {
            gameState.gameActive = false;
            document.getElementById('finalStats').innerHTML = `
                <div class="player-info">${gameState.avatar}</div>
                <p><strong>${gameState.nickname}</strong></p>
                <p class="snake-length">Length: <strong>${gameState.snake.length}</strong></p>
            `;
            showScreen('gameOverScreen');
        }

        // Game Over Screen Logic
        document.getElementById('playAgainButton').addEventListener('click', () => {
            nicknameInput.value = '';
            gameState.nickname = '';
            gameState.avatar = null;
            avatarButtons.forEach(btn => btn.classList.remove('selected'));
            updateStartButtonState();
            showScreen('startScreen');
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameState.gameActive) return;

            switch(e.key) {
                case 'ArrowUp':
                    gameState.nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    gameState.nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    gameState.nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    gameState.nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });
    </script>
</body>
</html>
