<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        #startScreen h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        #startScreen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 30px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        #startScreen input:focus {
            outline: none;
            border-color: #667eea;
        }

        .avatar-selector {
            margin-bottom: 30px;
        }

        .avatar-selector label {
            display: block;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .avatar-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .avatar-btn {
            width: 60px;
            height: 60px;
            border: 3px solid #ddd;
            border-radius: 50%;
            background: white;
            font-size: 2em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-btn:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .avatar-btn.selected {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        #startButton {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        #startButton:hover {
            background: #5568d3;
        }

        #startButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Game Screen */
        #gameScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #gameScore {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        canvas {
            border: 2px solid #333;
            background: #000;
            display: block;
        }

        /* Game Over Screen */
        #gameOverScreen {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        #gameOverScreen h2 {
            color: #d32f2f;
            margin-bottom: 40px;
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #finalStats {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #finalStats p {
            font-size: 1.3em;
            color: #333;
            margin: 12px 0;
            line-height: 1.8;
        }

        #finalStats p strong {
            color: #667eea;
            font-weight: bold;
        }

        .player-info {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .snake-length {
            font-size: 1.5em;
            color: #666;
        }

        #playAgainButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 50px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #playAgainButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #playAgainButton:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>🐍 Aether Snake</h1>
            <input type="text" id="nicknameInput" placeholder="Enter your nickname" maxlength="20">
            <div class="avatar-selector">
                <label>Choose your avatar:</label>
                <div class="avatar-options">
                    <button class="avatar-btn" data-avatar="🔴">🔴</button>
                    <button class="avatar-btn" data-avatar="🟠">🟠</button>
                    <button class="avatar-btn" data-avatar="🟡">🟡</button>
                    <button class="avatar-btn" data-avatar="🟢">🟢</button>
                    <button class="avatar-btn" data-avatar="🔵">🔵</button>
                </div>
            </div>
            <button id="startButton" disabled>Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <h2>Game Over!</h2>
            <div id="finalStats"></div>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            nickname: '',
            avatar: null,
            snake: [],
            food: {},
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            gameActive: false
        };

        // Screen management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Start Screen Logic
        const nicknameInput = document.getElementById('nicknameInput');
        const startButton = document.getElementById('startButton');
        const avatarButtons = document.querySelectorAll('.avatar-btn');

        function updateStartButtonState() {
            const hasNickname = nicknameInput.value.trim().length > 0;
            const hasAvatar = gameState.avatar !== null;
            startButton.disabled = !(hasNickname && hasAvatar);
        }

        nicknameInput.addEventListener('input', () => {
            gameState.nickname = nicknameInput.value.trim();
            updateStartButtonState();
        });

        avatarButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                avatarButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                gameState.avatar = btn.dataset.avatar;
                updateStartButtonState();
            });
        });

        startButton.addEventListener('click', () => {
            if (gameState.nickname && gameState.avatar) {
                initGame();
                showScreen('gameScreen');
            }
        });

        // Game initialization
        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;

            gameState.snake = [
                { x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }
            ];
            gameState.direction = { x: 1, y: 0 };
            gameState.nextDirection = { x: 1, y: 0 };
            gameState.gameActive = true;

            spawnFood();
            gameLoop(ctx, gridSize, tileCount);
        }

        function spawnFood() {
            const canvas = document.getElementById('gameCanvas');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;

            gameState.food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }


        function gameLoop(ctx, gridSize, tileCount) {
            if (!gameState.gameActive) return;

            update();
            render(ctx, gridSize);

            setTimeout(() => gameLoop(ctx, gridSize, tileCount), 100);
        }

        function update() {
            gameState.direction = gameState.nextDirection;
            const head = gameState.snake[0];
            const newHead = {
                x: head.x + gameState.direction.x,
                y: head.y + gameState.direction.y
            };

            const canvas = document.getElementById('gameCanvas');
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;

            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                endGame();
                return;
            }

            for (let segment of gameState.snake) {
                if (newHead.x === segment.x && newHead.y === segment.y) {
                    endGame();
                    return;
                }
            }

            gameState.snake.unshift(newHead);

            if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
                spawnFood();
            } else {
                gameState.snake.pop();
            }
        }

        function render(ctx, gridSize) {
            const canvas = document.getElementById('gameCanvas');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            for (let segment of gameState.snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            }

            ctx.fillStyle = '#f00';
            ctx.fillRect(gameState.food.x * gridSize, gameState.food.y * gridSize, gridSize - 1, gridSize - 1);
        }

        function endGame() {
            gameState.gameActive = false;
            document.getElementById('finalStats').innerHTML = `
                <div class="player-info">${gameState.avatar}</div>
                <p><strong>${gameState.nickname}</strong></p>
                <p class="snake-length">Length: <strong>${gameState.snake.length}</strong></p>
            `;
            showScreen('gameOverScreen');
        }

        // Game Over Screen Logic
        document.getElementById('playAgainButton').addEventListener('click', () => {
            nicknameInput.value = '';
            gameState.nickname = '';
            gameState.avatar = null;
            avatarButtons.forEach(btn => btn.classList.remove('selected'));
            updateStartButtonState();
            showScreen('startScreen');
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameState.gameActive) return;

            switch(e.key) {
                case 'ArrowUp':
                    if (gameState.direction.y === 0) gameState.nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (gameState.direction.y === 0) gameState.nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (gameState.direction.x === 0) gameState.nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (gameState.direction.x === 0) gameState.nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });
    </script>
</body>
</html>
